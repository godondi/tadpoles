volumes:
  tadpole-db-data:

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tadpole-app:latest
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_STUB_URL: ${AUTH_STUB_URL}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: ${SERVER_PORT}
      FAUX_SERVER_URL: ${FAUX_SERVER_URL}
      FAUX_API_KEY: ${FAUX_API_KEY}
      FAUX_DEFAULT_INTERVAL: ${FAUX_DEFAULT_INTERVAL}
      FAUX_CONNECT_TIMEOUT_SECONDS: ${FAUX_CONNECT_TIMEOUT_SECONDS}
      FAUX_READ_TIMEOUT_SECONDS: ${FAUX_READ_TIMEOUT_SECONDS}
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_CONTAINER_PORT}"
    depends_on:
      database-demo-seed:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: tadpole-frontend:latest
    environment:
      PORT: ${FRONTEND_CONTAINER_PORT}
    ports:
      - "${FRONTEND_HOST_PORT}:${FRONTEND_CONTAINER_PORT}"

  database:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - tadpole-db-data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  database-demo-seed:
    image: postgres:15
    environment:
      PGHOST: database
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./database/demo/role_workspaces.sql:/role_workspaces.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/role_workspaces.sql"]
    depends_on:
      database:
        condition: service_healthy


