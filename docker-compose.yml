volumes:
  tadpole-db-data:

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tadpole-app:latest
    container_name: tadpole-backend
    env_file:
      - .env
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_STUB_URL: ${AUTH_STUB_URL}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: ${SERVER_PORT:-8080}
      TRADING_ADMISSION_ENABLED: ${TRADING_ADMISSION_ENABLED:-true}
      TRADING_WORKER_ENABLED: ${TRADING_WORKER_ENABLED:-true}
      TRADING_LOCAL_DEMO_SETUP: ${TRADING_LOCAL_DEMO_SETUP:-true}
      # Local demo defaults. The hardened overlay requires explicit deployment policy.
      OPERATIONS_ACCESS_ENABLED: ${OPERATIONS_ACCESS_ENABLED:-true}
      OPERATIONS_ALLOWED_PURPOSES: ${OPERATIONS_ALLOWED_PURPOSES:-ORDER_REVIEW}
      OPERATIONS_POLICY_VERSION: ${OPERATIONS_POLICY_VERSION:-local-demo-v1}
      OPERATIONS_CONTEXT_SECONDS: ${OPERATIONS_CONTEXT_SECONDS:-3600}
      OPERATIONS_EXPORT_SECONDS: ${OPERATIONS_EXPORT_SECONDS:-3600}
      # Fictitious local demo only. Hardened deployments require a separately provisioned key.
      BANKING_ENCRYPTION_KEY: ${BANKING_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_CONTAINER_PORT}"
    depends_on:
      database-demo-seed:
        condition: service_completed_successfully
      auth-stub:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: tadpole-frontend:latest
    container_name: tadpole-frontend
    env_file:
      - .env
    environment:
      PORT: ${FRONTEND_CONTAINER_PORT}
    ports:
      - "${FRONTEND_HOST_PORT}:${FRONTEND_CONTAINER_PORT}"

  database:
    image: postgres:15
    container_name: tadpole-database
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - tadpole-db-data:/var/lib/postgresql/data
      - ./database/fresh:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12

  database-migrate:
    image: postgres:15
    env_file: [.env]
    environment:
      PGHOST: database
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./database/migrations:/migrations:ro
      - ./database/migrate.sh:/migrate.sh:ro
    command: ["sh", "/migrate.sh"]
    depends_on:
      database:
        condition: service_healthy

  database-demo-seed:
    image: postgres:15
    env_file:
      - .env
    environment:
      PGHOST: database
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TRADING_LOCAL_DEMO_SETUP: ${TRADING_LOCAL_DEMO_SETUP:-true}
      OPERATIONS_ACCESS_ENABLED: ${OPERATIONS_ACCESS_ENABLED:-true}
    volumes:
      - ./database/demo/role_workspaces.sql:/role_workspaces.sql:ro
      - ./database/demo/operations_workspace.sql:/operations_workspace.sql:ro
      - ./database/demo/seed-role-workspaces.sh:/seed-role-workspaces.sh:ro
    command: ["sh", "/seed-role-workspaces.sh"]
    depends_on:
      database-migrate:
        condition: service_completed_successfully

  auth-stub:
    build:
      context: ./auth-stub
      dockerfile: Dockerfile
    image: tadpole-auth-stub:latest
    container_name: tadpole-auth-stub
    env_file:
      - .env
    environment:
      PORT: ${AUTH_STUB_PORT}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${AUTH_STUB_HOST_PORT}:${AUTH_STUB_CONTAINER_PORT}"

