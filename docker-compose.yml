services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tadpole-app:latest
    container_name: tadpole-backend
    env_file:
      - .env
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_STUB_URL: ${AUTH_STUB_URL}
      PORT: ${PORT}
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_CONTAINER_PORT}"
    depends_on:
      - database
      - auth-stub

  database:
    image: postgres:15
    container_name: tadpole-database
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - tadpole-db-data:/var/lib/postgresql/data

  auth-stub:
    build:
      context: ./auth-stub
      dockerfile: Dockerfile
    image: tadpole-auth-stub:latest
    container_name: tadpole-auth-stub
    env_file:
      - .env
    environment:
      PORT: ${AUTH_STUB_PORT}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${AUTH_STUB_HOST_PORT}:${AUTH_STUB_CONTAINER_PORT}"

