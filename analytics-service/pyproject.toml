[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tadpoles-analytics-service"
version = "0.1.0"
description = "Read-only analytics API for the Tadpoles reporting database"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "PyJWT>=2.9,<3",
  "pydantic>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["app*"]
