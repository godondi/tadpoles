events {}

http {

    log_format upstream_trace
            '$remote_addr "$request" status=$status '
            'upstream_status=$upstream_status '
            'upstream_addr=$upstream_addr request_time=$request_time '
            'upstream_response_time=$upstream_response_time';

    access_log /dev/stdout upstream_trace;
    error_log /dev/stderr warn;

    upstream frontend {
        server frontend:4000;
    }

    upstream backend {
        server backend:8080;
    }

    upstream analytics {
        server analytics-api:8000;
    }

    server {
        listen 80;

        location /api/analytics/ {
            proxy_pass http://analytics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health/ready {
            proxy_pass http://analytics/health/ready;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /auth/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            proxy_pass http://backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
