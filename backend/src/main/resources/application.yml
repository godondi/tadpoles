spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

mybatis:
  type-aliases-package: com.neueda.leap.domain
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT}

jwt:
  secret: ${JWT_SECRET}

fauxnance:
  base-url: ${FAUX_SERVER_URL}
  api-key: ${FAUX_API_KEY}
  default-interval: ${FAUX_DEFAULT_INTERVAL}
  connect-timeout-seconds: ${FAUX_CONNECT_TIMEOUT_SECONDS}
  read-timeout-seconds: ${FAUX_READ_TIMEOUT_SECONDS}
