components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AdvisorId:
      name: advisorId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PortfolioId:
      name: portfolioId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    InstrumentId:
      name: instrumentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    FauxnanceSymbol:
      name: symbol
      in: path
      required: true
      description: Case-insensitive Fauxnance symbol. Responses use uppercase.
      schema:
        type: string
        minLength: 1
        maxLength: 32
      example: AAPL
    CandleFrom:
      name: from
      in: query
      required: false
      description: Inclusive start date for the candle range.
      schema:
        type: string
        format: date
      example: 2026-01-01 00:00:00+00:00
    CandleTo:
      name: to
      in: query
      required: false
      description: Inclusive end date for the candle range.
      schema:
        type: string
        format: date
      example: 2026-01-31 00:00:00+00:00
    CandleInterval:
      name: interval
      in: query
      required: false
      description: Candle interval. Version 1 supports only `1d`.
      schema:
        type: string
        default: 1d
        enum:
        - 1d
    TradeId:
      name: tradeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AnalyticsFrom:
      name: from
      in: query
      required: true
      description: Inclusive reporting period start.
      schema:
        type: string
        format: date
    AnalyticsTo:
      name: to
      in: query
      required: true
      description: Inclusive reporting period end; must not precede from.
      schema:
        type: string
        format: date
    AnalyticsTimezone:
      name: timezone
      in: query
      required: false
      schema:
        type: string
        default: UTC
    AnalyticsGranularity:
      name: granularity
      in: query
      required: false
      schema:
        type: string
        enum: [day, week, month]
        default: day
    AnalyticsMarket:
      name: market
      in: query
      required: false
      schema:
        type: string
    AnalyticsAssetClass:
      name: asset_class
      in: query
      required: false
      schema:
        type: string
    AnalyticsInstrument:
      name: instrument
      in: query
      required: false
      schema:
        type: string
    AnalyticsSegment:
      name: segment
      in: query
      required: false
      description: Approved pseudonymous segment key; entitlement is checked by the service.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid or malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but missing the required role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Duplicate resource or conflicting state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Request limit exceeded. Retry according to Retry-After when supplied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server failure. An uncertain cash movement or order submission must be recovered using the original
        request key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Invalid or unsupported analytics filters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Query rate or concurrency limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Reporting source unavailable; no values are fabricated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required:
      - token
      - tokenType
      - expiresIn
      properties:
        token:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          example: 3600
        userId:
          type:
          - integer
          - 'null'
        clientId:
          type:
          - integer
          - 'null'
        email:
          type: string
        displayName:
          type: string
        onboardingComplete:
          type: boolean
    RefreshTokenRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    RegisterUserRequest:
      type: object
      required:
      - username
      - email
      - password
      - displayName
      - roleType
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        displayName:
          type: string
        roleType:
          type: string
          enum:
          - ADMIN
          - AUDITOR
          - ANALYST
          - ADVISOR
          - CLIENT
          - COMPLIANCE
          - SUPPORT
          - OPERATIONS
          - REPORTING
          - GUEST
          - TRADING_OPS
          - FINANCE
        advisorName:
          type: string
          nullable: true
        enabled:
          type: boolean
          nullable: true
          default: true
    ClientRegistrationRequest:
      type: object
      required:
      - username
      - email
      - password
      - displayName
      - clientName
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        displayName:
          type: string
        clientName:
          type: string
    RegisterUserResponse:
      type: object
      required:
      - userId
      - username
      - displayName
      - role
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
        advisorId:
          type: integer
          format: int64
          nullable: true
    ClientRegistrationResponse:
      type: object
      required:
      - userId
      - username
      - displayName
      - role
      - clientId
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum:
          - CLIENT
        clientId:
          type: integer
          format: int64
    AuthTokens:
      type: object
      required:
      - accessToken
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresInSeconds:
          type: integer
          format: int64
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
          nullable: true
        path:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          nullable: true
    UserProfile:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        enabled:
          type: boolean
        roles:
          type: array
          items:
            type: string
        advisorId:
          type: integer
          format: int64
          nullable: true
        clientId:
          type: integer
          format: int64
          nullable: true
    UserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserProfile'
    UpdateUserRequest:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: string
          format: email
        enabled:
          type: boolean
    UserRolesRequest:
      type: object
      required:
      - roles
      properties:
        roles:
          type: array
          items:
            type: string
    AdvisorSummary:
      type: object
      properties:
        advisorId:
          type: integer
          format: int64
        advisorName:
          type: string
        userId:
          type: integer
          format: int64
          nullable: true
    AdvisorListResponse:
      type: object
      properties:
        advisors:
          type: array
          items:
            $ref: '#/components/schemas/AdvisorSummary'
    CreateAdvisorRequest:
      type: object
      required:
      - advisorName
      properties:
        advisorName:
          type: string
        userId:
          type: integer
          format: int64
          nullable: true
    UpdateAdvisorRequest:
      type: object
      properties:
        advisorName:
          type: string
