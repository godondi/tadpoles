openapi: 3.1.0
info:
  title: Tadpoles API Starter
  version: 1.0.0
  description: OpenAPI contract for the Tadpoles Spring Boot application. Actual backend paths with role-enforced workspace reads. Staff data capabilities return 503 until approved policies and sources are configured. New order submission is disabled by decision; no acceptance or execution is implied.
servers:
- url: /
  description: Application API root
tags:
- name: Authentication
- name: Users
- name: Advisors
- name: Clients
- name: Portfolios
- name: Instruments
- name: Market Data
- name: Trades
- name: Trade Suggestions
- name: Audit
- name: Analytics
- name: Dashboard
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
      - Authentication
      summary: Register a new application user
      operationId: registerUser
      x-required-roles:
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/register/client:
    post:
      tags:
      - Authentication
      summary: Register a new client account
      operationId: registerClient
      x-required-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRegistrationRequest'
      responses:
        '201':
          description: Client account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Authenticate a user and return JWT tokens
      operationId: login
      x-required-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/refresh:
    post:
      tags:
      - Authentication
      summary: exchange a refresh token for a new access token
      operationId: refreshToken
      x-required-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/logout:
    post:
      tags:
      - Authentication
      summary: revoke the current refresh token
      operationId: logout
      x-required-roles:
      - ADMIN
      - AUDITOR
      - ANALYST
      - ADVISOR
      - CLIENT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Token revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/users/me:
    get:
      tags:
      - Users
      summary: Current authoritative identity and assigned roles; any authenticated enabled user
      operationId: getCurrentUser
      x-required-roles: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/users:
    get:
      tags:
      - Users
      summary: List users for administration
      operationId: listUsers
      x-required-roles:
      - ADMIN
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/users/{userId}:
    parameters:
    - $ref: '#/components/parameters/UserId'
    get:
      tags:
      - Users
      summary: Get a user by ID
      operationId: getUserById
      x-required-roles:
      - ADMIN
      responses:
        '200':
          description: User record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Users
      summary: Update a user profile or status
      operationId: updateUser
      x-required-roles:
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/users/{userId}/roles:
    parameters:
    - $ref: '#/components/parameters/UserId'
    put:
      tags:
      - Users
      summary: Replace the roles assigned to a user
      operationId: setUserRoles
      x-required-roles:
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRolesRequest'
      responses:
        '200':
          description: Roles updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/advisors:
    get:
      tags:
      - Advisors
      summary: List advisors
      operationId: listAdvisors
      x-required-roles:
      - ADMIN
      - AUDITOR
      responses:
        '200':
          description: Advisor list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisorListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Advisors
      summary: Create an advisor record
      operationId: createAdvisor
      x-required-roles:
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdvisorRequest'
      responses:
        '201':
          description: Advisor created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisorSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/advisors/{advisorId}:
    parameters:
    - $ref: '#/components/parameters/AdvisorId'
    get:
      tags:
      - Advisors
      summary: Get advisor details
      operationId: getAdvisorById
      x-required-roles:
      - ADMIN
      - AUDITOR
      - ADVISOR
      responses:
        '200':
          description: Advisor record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisorSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Advisors
      summary: Update advisor metadata
      operationId: updateAdvisor
      x-required-roles:
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdvisorRequest'
      responses:
        '200':
          description: Advisor updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisorSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/advisors/{advisorId}/clients:
    parameters:
    - $ref: '#/components/parameters/AdvisorId'
    get:
      tags:
      - Advisors
      summary: List clients assigned to an advisor
      operationId: listAdvisorClients
      x-required-roles:
      - ADMIN
      - ADVISOR
      responses:
        '200':
          description: Clients for advisor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/clients:
    get:
      tags:
      - Clients
      summary: List clients
      operationId: listClients
      x-required-roles:
      - ADMIN
      responses:
        '200':
          description: Client list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Clients
      summary: Create a client record
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
      responses:
        '201':
          description: Client created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/clients/{clientId}:
    parameters:
    - $ref: '#/components/parameters/ClientId'
    get:
      tags:
      - Clients
      summary: Get client details
      operationId: getClientById
      responses:
        '200':
          description: Client summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Clients
      summary: Update a client record
      operationId: updateClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientRequest'
      responses:
        '200':
          description: Client updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/clients/{clientId}/balance:
    parameters:
    - $ref: '#/components/parameters/ClientId'
    get:
      tags:
      - Clients
      summary: Get the client cash balance
      operationId: getClientBalance
      responses:
        '200':
          description: Client cash balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientBalanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/clients/{clientId}/subscriptions:
    parameters:
    - $ref: '#/components/parameters/ClientId'
    get:
      tags:
      - Clients
      summary: Get subscriptions for a client
      operationId: listClientSubscriptions
      x-required-roles:
      - ADMIN
      - AUDITOR
      - ADVISOR
      - CLIENT
      responses:
        '200':
          description: Subscription list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionListResponse'
    post:
      tags:
      - Clients
      summary: Subscribe a client to a model portfolio
      operationId: createClientSubscription
      x-required-roles:
      - ADMIN
      - ADVISOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionSummary'
  /api/clients/{clientId}/holdings:
    parameters:
    - $ref: '#/components/parameters/ClientId'
    get:
      tags:
      - Clients
      summary: Get current holdings for a client
      operationId: getClientHoldings
      responses:
        '200':
          description: Holding list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Clients
      summary: Create a holding for a client
      operationId: createClientHolding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientHoldingRequest'
      responses:
        '201':
          description: Holding created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/clients/{clientId}/holdings/{holdingId}:
    parameters:
    - $ref: '#/components/parameters/ClientId'
    - name: holdingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - Clients
      summary: Get a holding by ID
      operationId: getClientHolding
      responses:
        '200':
          description: Holding record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Clients
      summary: Update a holding
      operationId: updateClientHolding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientHoldingRequest'
      responses:
        '200':
          description: Holding updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/clients/{clientId}/trades:
    parameters:
    - $ref: '#/components/parameters/ClientId'
    get:
      tags:
      - Clients
      summary: List trades for a client
      operationId: listClientTrades
      responses:
        '200':
          description: Trade history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Clients
      summary: Submit an actual trade for a client
      operationId: createClientTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientTradeRequest'
      responses:
        '201':
          description: Trade created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/clients/{clientId}/trades/{tradeId}:
    parameters:
    - $ref: '#/components/parameters/ClientId'
    - $ref: '#/components/parameters/TradeId'
    get:
      tags:
      - Clients
      summary: Get a trade by ID for a client
      operationId: getClientTrade
      responses:
        '200':
          description: Trade summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Clients
      summary: Update a client trade
      operationId: updateClientTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientTradeRequest'
      responses:
        '200':
          description: Trade updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/clients/{clientId}/trades/{tradeId}/fill:
    parameters:
    - $ref: '#/components/parameters/ClientId'
    - $ref: '#/components/parameters/TradeId'
    post:
      tags:
      - Clients
      summary: Fill a client trade order
      operationId: fillClientTrade
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FillOrderRequest'
      responses:
        '200':
          description: Order filled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderFillResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/advisors/{advisorId}/clients/{clientId}/trade-suggestions:
    parameters:
    - $ref: '#/components/parameters/AdvisorId'
    - $ref: '#/components/parameters/ClientId'
    post:
      tags:
      - Trade Suggestions
      summary: Suggest a trade for a client
      operationId: createTradeSuggestion
      x-required-roles:
      - ADVISOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeSuggestionRequest'
      responses:
        '201':
          description: Trade suggestion created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeSuggestionSummary'
  /api/clients/{clientId}/trade-suggestions:
    parameters:
    - $ref: '#/components/parameters/ClientId'
    get:
      tags:
      - Trade Suggestions
      summary: List trade suggestions for a client
      operationId: listClientTradeSuggestions
      x-required-roles:
      - ADMIN
      - AUDITOR
      - ADVISOR
      - CLIENT
      responses:
        '200':
          description: Trade suggestion list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeSuggestionListResponse'
  /api/trade-suggestions/{suggestionId}:
    parameters:
    - name: suggestionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - Trade Suggestions
      summary: Get a trade suggestion by ID
      operationId: getTradeSuggestionById
      x-required-roles:
      - ADMIN
      - AUDITOR
      - ADVISOR
      - CLIENT
      responses:
        '200':
          description: Trade suggestion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeSuggestionSummary'
    patch:
      tags:
      - Trade Suggestions
      summary: Update the status of a trade suggestion
      operationId: updateTradeSuggestionStatus
      x-required-roles:
      - CLIENT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeSuggestionDecisionRequest'
      responses:
        '200':
          description: Trade suggestion updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeSuggestionSummary'
  /api/model-portfolios:
    get:
      tags:
      - Portfolios
      summary: List model portfolios
      operationId: listModelPortfolios
      x-required-roles:
      - ADMIN
      - AUDITOR
      - ADVISOR
      responses:
        '200':
          description: Model portfolio list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPortfolioListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Portfolios
      summary: Create a model portfolio
      operationId: createModelPortfolio
      x-required-roles:
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModelPortfolioRequest'
      responses:
        '201':
          description: Portfolio created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPortfolioSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/model-portfolios/{portfolioId}:
    parameters:
    - $ref: '#/components/parameters/PortfolioId'
    get:
      tags:
      - Portfolios
      summary: Get model portfolio details
      operationId: getModelPortfolio
      x-required-roles:
      - ADMIN
      - AUDITOR
      - ADVISOR
      - CLIENT
      responses:
        '200':
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPortfolioSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Portfolios
      summary: Update portfolio metadata
      operationId: updateModelPortfolio
      x-required-roles:
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateModelPortfolioRequest'
      responses:
        '200':
          description: Portfolio updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPortfolioSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/model-portfolios/{portfolioId}/holdings:
    parameters:
    - $ref: '#/components/parameters/PortfolioId'
    get:
      tags:
      - Portfolios
      summary: Get target holdings for a model portfolio
      operationId: getModelPortfolioHoldings
      x-required-roles:
      - ADMIN
      - AUDITOR
      - ADVISOR
      - CLIENT
      responses:
        '200':
          description: Target holding list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetHoldingListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
