openapi: 3.1.0
info:
  title: Tadpoles API Starter
  version: 1.0.0
  description: >-
    OpenAPI contract for the Tadpoles Spring Boot application.
    The spec includes the currently implemented backend routes (login, register,
    clients, holdings, trades, instruments) and also retains planned routes that
    will be implemented later. JWT authentication is required for all protected
    routes; role checks are applied only where the backend currently enforces them.
servers:
  - url: /api
    description: Application API root

tags:
  - name: Authentication
  - name: Users
  - name: Advisors
  - name: Clients
  - name: Portfolios
  - name: Instruments
  - name: Trades
  - name: Trade Suggestions
  - name: Audit
  - name: Analytics
  - name: Dashboard

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new application user
      operationId: registerUser
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/register/client:
    post:
      tags: [Authentication]
      summary: Register a new client account
      operationId: registerClient
      x-required-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRegistrationRequest'
      responses:
        '201':
          description: Client account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a user and start a revocable session
      operationId: login
      x-required-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Exchange a refresh token for a rotated session token pair
      operationId: refreshToken
      x-required-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current session refresh token
      operationId: logout
      x-required-roles: [ADMIN, AUDITOR, ANALYST, ADVISOR, CLIENT]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Token revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{userId}/refresh-tokens/revoke-all:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Authentication]
      summary: Revoke all active refresh tokens for a user
      operationId: revokeUserRefreshTokens
      x-required-roles: [ADMIN]
      responses:
        '204':
          description: All active refresh tokens revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me:
    get:
      tags: [Users]
      summary: Get the currently authenticated user profile
      operationId: getCurrentUser
      x-required-roles: [ADMIN, AUDITOR, ANALYST, ADVISOR, CLIENT]
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [Users]
      summary: List users for administration
      operationId: listUsers
      x-required-roles: [ADMIN]
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get a user by ID
      operationId: getUserById
      x-required-roles: [ADMIN]
      responses:
        '200':
          description: User record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Update a user profile or status
      operationId: updateUser
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/roles:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Users]
      summary: Replace the roles assigned to a user
      operationId: setUserRoles
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRolesRequest'
      responses:
        '200':
          description: Roles updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /advisors:
    get:
      tags: [Advisors]
      summary: List advisors
      operationId: listAdvisors
      x-required-roles: [ADMIN, AUDITOR, ANALYST]
      responses:
        '200':
          description: Advisor list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisorListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Advisors]
      summary: Create an advisor record
      operationId: createAdvisor
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdvisorRequest'
      responses:
        '201':
          description: Advisor created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisorSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /advisors/{advisorId}:
    parameters:
      - $ref: '#/components/parameters/AdvisorId'
    get:
      tags: [Advisors]
      summary: Get advisor details
      operationId: getAdvisorById
      x-required-roles: [ADMIN, AUDITOR, ANALYST, ADVISOR]
      responses:
        '200':
          description: Advisor record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisorSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Advisors]
      summary: Update advisor metadata
      operationId: updateAdvisor
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdvisorRequest'
      responses:
        '200':
          description: Advisor updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisorSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /advisors/{advisorId}/clients:
    parameters:
      - $ref: '#/components/parameters/AdvisorId'
    get:
      tags: [Advisors]
      summary: List clients assigned to an advisor
      operationId: listAdvisorClients
      x-required-roles: [ADMIN, ADVISOR]
      responses:
        '200':
          description: Clients for advisor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /clients:
    get:
      tags: [Clients]
      summary: List clients
      operationId: listClients
      x-required-roles: [ADMIN]
      responses:
        '200':
          description: Client list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Clients]
      summary: Create a client record
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
      responses:
        '201':
          description: Client created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /clients/{clientId}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      tags: [Clients]
      summary: Get client details
      operationId: getClientById
      responses:
        '200':
          description: Client summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Clients]
      summary: Update a client record
      operationId: updateClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientRequest'
      responses:
        '200':
          description: Client updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /clients/{clientId}/balance:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      tags: [Clients]
      summary: Get the client cash balance
      operationId: getClientBalance
      responses:
        '200':
          description: Client cash balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientBalanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /clients/{clientId}/advisor:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    put:
      tags: [Clients]
      summary: Assign or reassign a client to an advisor
      operationId: assignClientAdvisor
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignAdvisorRequest'
      responses:
        '200':
          description: Advisor assignment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSummary'

  /clients/{clientId}/subscriptions:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      tags: [Clients]
      summary: Get subscriptions for a client
      operationId: listClientSubscriptions
      x-required-roles: [ADMIN, AUDITOR, ANALYST, ADVISOR, CLIENT]
      responses:
        '200':
          description: Subscription list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Clients]
      summary: Subscribe a client to a model portfolio
      operationId: createClientSubscription
      x-required-roles: [ADMIN, ADVISOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionSummary'

  /clients/{clientId}/holdings:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      tags: [Clients]
      summary: Get current holdings for a client
      operationId: getClientHoldings
      responses:
        '200':
          description: Holding list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Clients]
      summary: Create a holding for a client
      operationId: createClientHolding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientHoldingRequest'
      responses:
        '201':
          description: Holding created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /clients/{clientId}/holdings/{holdingId}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
      - name: holdingId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Clients]
      summary: Get a holding by ID
      operationId: getClientHolding
      responses:
        '200':
          description: Holding record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Clients]
      summary: Update a holding
      operationId: updateClientHolding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientHoldingRequest'
      responses:
        '200':
          description: Holding updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /clients/{clientId}/trades:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      tags: [Clients]
      summary: List trades for a client
      operationId: listClientTrades
      responses:
        '200':
          description: Trade history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Clients]
      summary: Submit an actual trade for a client
      operationId: createClientTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientTradeRequest'
      responses:
        '201':
          description: Trade created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeSummary'
        '400':
          description: Invalid trade request, including inactive instruments or failed trading-rule checks such as insufficient cash or holdings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /clients/{clientId}/trades/{tradeId}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/TradeId'
    get:
      tags: [Clients]
      summary: Get a trade by ID for a client
      operationId: getClientTrade
      responses:
        '200':
          description: Trade summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Clients]
      summary: Update a client trade
      operationId: updateClientTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientTradeRequest'
      responses:
        '200':
          description: Trade updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /clients/{clientId}/trades/{tradeId}/fill:
    parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/TradeId'
    post:
      tags: [Clients]
      summary: Fill a client trade order
      operationId: fillClientTrade
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FillOrderRequest'
      responses:
        '200':
          description: Order filled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderFillResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /advisors/{advisorId}/clients/{clientId}/trade-suggestions:
    parameters:
      - $ref: '#/components/parameters/AdvisorId'
      - $ref: '#/components/parameters/ClientId'
    post:
      tags: [Trade Suggestions]
      summary: Suggest a trade for a client
      operationId: createTradeSuggestion
      x-required-roles: [ADVISOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeSuggestionRequest'
      responses:
        '201':
          description: Trade suggestion created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeSuggestionSummary'

  /clients/{clientId}/trade-suggestions:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      tags: [Trade Suggestions]
      summary: List trade suggestions for a client
      operationId: listClientTradeSuggestions
      x-required-roles: [ADMIN, AUDITOR, ANALYST, ADVISOR, CLIENT]
      responses:
        '200':
          description: Trade suggestion list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeSuggestionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /trade-suggestions/{suggestionId}:
    parameters:
      - name: suggestionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Trade Suggestions]
      summary: Get a trade suggestion by ID
      operationId: getTradeSuggestionById
      x-required-roles: [ADMIN, AUDITOR, ANALYST, ADVISOR, CLIENT]
      responses:
        '200':
          description: Trade suggestion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeSuggestionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Trade Suggestions]
      summary: Update the status of a trade suggestion
      operationId: updateTradeSuggestionStatus
      x-required-roles: [CLIENT]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeSuggestionDecisionRequest'
      responses:
        '200':
          description: Trade suggestion updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeSuggestionSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /model-portfolios:
    get:
      tags: [Portfolios]
      summary: List model portfolios
      operationId: listModelPortfolios
      x-required-roles: [ADMIN, AUDITOR, ANALYST, ADVISOR]
      responses:
        '200':
          description: Model portfolio list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPortfolioListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Portfolios]
      summary: Create a model portfolio
      operationId: createModelPortfolio
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
